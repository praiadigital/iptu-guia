<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>IPTU Guia — Praia Digital</title><meta name="description" content="Compare IPTU e taxas municipais entre as cidades do litoral paulista."><link rel="canonical" href="https://praia.digital/iptu-guia/"><style>body{font-family:system-ui,sans-serif;margin:0;background:#f8fafc;color:#0f172a}main{max-width:860px;margin:auto;padding:24px}table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden}td,th{padding:10px;border-bottom:1px solid #e2e8f0;text-align:left}input,select{padding:10px;border-radius:8px;border:1px solid #cbd5e1;margin:4px 0}.btn{display:inline-block;padding:10px 16px;border-radius:10px;background:#0a58ca;color:#fff;text-decoration:none;font-weight:600}</style></head><body><nav style="background:#0a2540;padding:14px 20px"><span style="color:#fff;font-weight:700;margin-right:16px">🌊 Praia Digital</span><a href="https://praia.digital/apps/" style="color:#9fd8ff;margin-right:12px">Apps</a><a href="https://praia.digital/calculadora-custos/" style="color:#9fd8ff;margin-right:12px">Calculadora de Custos</a><a href="https://praia.digital/comparador-cidades/" style="color:#9fd8ff">Comparador de Cidades</a></nav><main><h1>🏛️ IPTU Guia do Litoral</h1><p>Estimativa anual de IPTU por cidade (alíquota média sobre valor venal). Valores aproximados — confirme na prefeitura.</p><label>Valor venal do imóvel (R$) <input id="v" type="number" value="300000" oninput="go()"></label><table><tr><th>Cidade</th><th>Alíquota típica</th><th>IPTU estimado/ano</th></tr><tbody id="tb"></tbody></table><p><a class="btn" href="https://praia.digital/calculadora-custos/">Calcular custo total da compra</a></p></main><script>const C=[['Santos',1.0],['Guarujá',0.8],['Praia Grande',0.7],['São Vicente',0.8],['Bertioga',0.5],['Mongaguá',0.6],['Itanhaém',0.6],['Peruíbe',0.5]];function go(){const v=+document.getElementById('v').value||0;document.getElementById('tb').innerHTML=C.map(c=>'<tr><td>'+c[0]+'</td><td>'+c[1].toFixed(1)+'%</td><td>'+(v*c[1]/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})+'</td></tr>').join('');}go();</script></body></html>
